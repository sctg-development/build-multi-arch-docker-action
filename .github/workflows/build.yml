name: Build Multi-Arch Docker with Binary Extraction

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to the Dockerfile to build'
        type: string
        required: false
        default: 'Dockerfile'
      context:
        description: 'Docker build context'
        type: string
        required: false
        default: '.'
      image:
        description: 'Docker Hub image name (e.g., user/repo)'
        type: string
        required: true
      tags:
        description: 'Tags in docker/metadata-action format (multiline). Empty = metadata-action defaults'
        type: string
        required: false
        default: ''
      build-args:
        description: 'Build arguments (multiline KEY=VALUE)'
        type: string
        required: false
        default: ''
      artifact-prefix:
        description: 'Unique prefix for artifacts to avoid conflicts (defaults to the run id)'
        type: string
        required: false
        default: ''
      submodules:
        description: 'Checkout submodules: false, true or recursive'
        type: string
        required: false
        default: 'false'
      cleanup:
        description: 'Clean up runner disk space before building'
        type: boolean
        required: false
        default: true
      extract-binary:
        description: 'Extract binary from the built image'
        type: boolean
        required: false
        default: false
      binary-path:
        description: 'Path to the binary inside the container'
        type: string
        required: false
        default: ''
      binary-name:
        description: 'Base name for the extracted binary'
        type: string
        required: false
        default: ''
      release-tag:
        description: 'GitHub release tag name for upload'
        type: string
        required: false
        default: ''
      attest:
        description: 'Create build provenance attestation'
        type: boolean
        required: false
        default: false
    secrets:
      DOCKER_USERNAME:
        required: true
        description: 'Docker Hub username'
      DOCKER_PASSWORD:
        required: true
        description: 'Docker Hub password or token'
    outputs:
      image-digest:
        description: 'SHA256 digest of the built multi-arch image'
        value: ${{ jobs.merge.outputs.digest }}

env:
  IMAGE: ${{ inputs.image }}
  ARTIFACT_PREFIX: ${{ inputs.artifact-prefix || github.run_id }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Validate binary extraction inputs
        if: ${{ inputs.extract-binary }}
        env:
          BINARY_PATH: ${{ inputs.binary-path }}
          BINARY_NAME: ${{ inputs.binary-name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          for v in BINARY_PATH BINARY_NAME RELEASE_TAG; do
            if [[ -z "${!v}" ]]; then
              echo "::error::${v} is required when extract-binary is true"
              exit 1
            fi
          done

      - name: Optimize disk space
        if: ${{ inputs.cleanup }}
        uses: sctg-development/clean-image-for-docker@v2

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.ARTIFACT_PREFIX }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.ARTIFACT_PREFIX }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Extract binary from the image (native)
        if: ${{ inputs.extract-binary }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BINARY_PATH: ${{ inputs.binary-path }}
          BINARY_NAME: ${{ inputs.binary-name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          out="${RUNNER_TEMP}/binaries"
          mkdir -p "$out"
          docker pull "${IMAGE}@${DIGEST}"
          cid=$(docker create "${IMAGE}@${DIGEST}")
          docker cp "${cid}:${BINARY_PATH}" "${out}/${BINARY_NAME}_linux_${ARCH}_${RELEASE_TAG}"
          docker rm "$cid"

      - name: Upload binary artifact
        if: ${{ inputs.extract-binary }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ env.ARTIFACT_PREFIX }}-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Create manifest list and push
        id: merge
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t TAG_ARGS < <(jq -r '.tags[] | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCES=()
          for d in *; do SOURCES+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

          FIRST_TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          MANIFEST_DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

  release-binaries:
    name: Publish binaries
    runs-on: ubuntu-26.04
    needs: [build, merge]
    if: ${{ inputs.extract-binary }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/binaries
          pattern: ${{ env.ARTIFACT_PREFIX }}-binary-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}"/binaries/* --clobber

      - name: Attest release
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ runner.temp }}/binaries/*
